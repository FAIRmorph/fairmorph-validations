name: CS-PHOC - real-data Engine and export content validation

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  reference-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout validation repository
        uses: actions/checkout@v4
      - name: Check public validation documentation
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          docs = [
              Path("README.md"), Path("INSTALL.md"), Path("THIRD-PARTY-NOTICES.md"),
              *Path("docs").rglob("*.md"), *Path("cs-phoc").rglob("*.md")
          ]
          legacy = re.compile(r"\bphase[ -]?[a-c](?:[ .-]|\b)|\b[bc][.][1-4]\b|\bc1-c4\b|\bphase-[abc]\b", re.I)
          for document in docs:
              text = document.read_text(encoding="utf-8")
              assert not legacy.search(text), f"Historical stage label in {document}"
              for link in re.findall(r"\]\(([^)]+)\)", text):
                  target = link.split("#", 1)[0].strip()
                  if target.endswith(".md") and not (document.parent / target).is_file():
                      raise AssertionError(f"Broken documentation link in {document}: {link}")

          landing = Path("cs-phoc/validation/README.md").read_text(encoding="utf-8")
          for required in (
              "Result: the bounded technical test passed",
              "11,599", "4,500", "16,940",
              "TEST-EXPORTS.md", "INDEPENDENT-CONTENT-AUDIT.md",
              "CS-PHOC-REPRODUCTION-AND-RESULTS.md"
          ):
              assert required in landing, f"Missing landing page evidence: {required}"
          print(f"Checked {len(docs)} public Markdown pages and their local links")
          PY
      - name: Checkout pinned FAIRmorph Engine
        uses: actions/checkout@v4
        with:
          repository: FAIRmorph/fairmorph-engine
          ref: c84b6f87585bab1237d6383cd3a47311f57250c2
          path: dependencies/fairmorph-engine
          persist-credentials: false
      - name: Checkout pinned CS-PHOC originals
        uses: actions/checkout@v4
        with:
          repository: us-amlr/cs-phoc
          ref: 64f0b77e631c711c681306bbb56a7636ae91a471
          path: dependencies/cs-phoc
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned Engine
        run: python -m pip install -e dependencies/fairmorph-engine
      - name: Import pinned originals and validate generic Engine RUN/2
        run: python scripts/run_cs_phoc.py --upstream dependencies/cs-phoc --project validation-output/cs-phoc.fairmorph
      - name: Register 23 unreviewed source field definitions
        run: |
          python scripts/register_cs_phoc_field_drafts.py --project validation-output/cs-phoc.fairmorph
          python scripts/register_cs_phoc_field_drafts.py --project validation-output/cs-phoc.fairmorph --apply
      - name: Generate three source-checked test formats from verified RUN/2
        shell: bash
        run: |
          RUN_ID=$(python -c 'import json; print(json.load(open("artifacts/phase-a-result.json"))["run_id"])')
          python scripts/export_cs_phoc_test_formats.py \
            --project validation-output/cs-phoc.fairmorph \
            --run-id "$RUN_ID" \
            --output validation-output/cs-phoc-test-exports
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("validation-output/cs-phoc-test-exports/test-report.json")
          report = json.loads(p.read_text(encoding="utf-8"))
          assert report["status"] == "passed"
          assert report["publication_ready"] is False
          assert report["cell_by_cell_run_match"] is True
          assert report["dwca_meta_xsd_validated"] is True
          assert report["derived_rows"] == {
              "events": 536, "occurrences": 16940,
              "pangaea_tsv": 16940, "geojson_features": 536
          }
          assert report["count_sum"] == 79232
          assert report["explicit_zero_count_values"] == 11599
          PY
      - name: Independently audit exported files and seven source examples
        run: |
          python scripts/audit_cs_phoc_test_exports.py \
            --project validation-output/cs-phoc.fairmorph \
            --exports validation-output/cs-phoc-test-exports \
            --report validation-output/cs-phoc-final-content-audit.json
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path("validation-output/cs-phoc-final-content-audit.json").read_text())
          assert r["status"] == "passed"
          assert len(r["sample_checks"]) == 7
          assert all(x["status"] == "passed" for x in r["sample_checks"].values())
          assert all(r["checks"].values())
          assert r["counts"]["missing_source_category_cells"] == 4500
          PY
      - name: Reject executable scripts inside generated FAIRmorph project
        shell: bash
        run: |
          if find validation-output/cs-phoc.fairmorph -type f \( -name '*.py' -o -name '*.sh' -o -name '*.ps1' -o -name '*.js' -o -name '*.ts' \) | grep -q .; then
            echo "::error::Executable file found inside generated FAIRmorph project"
            exit 1
          fi
      - name: Upload small independent content audit JSON only
        uses: actions/upload-artifact@v4
        with:
          name: cs-phoc-c4-audit-report
          path: validation-output/cs-phoc-final-content-audit.json
          retention-days: 14
      - name: Upload metadata evidence only (not source data)
        uses: actions/upload-artifact@v4
        with:
          name: cs-phoc-phase-a-evidence
          path: artifacts/phase-a-result.json
          retention-days: 14
